[package]
name = "rustboyadvance-utils"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ringbuf = "0.4.8"
log = "0.4.8"
goblin = "0.10.1"


[features]
# Browser clock for FpsCounter on wasm32 (needs wasm-bindgen JS glue). Plain wasm32 embedders,
# such as statically recompiled builds run by Bun, keep it off.
wasm-bindgen = ["dep:instant"]

[target.'cfg(target_arch="wasm32")'.dependencies]
instant = { version = "0.1.2", features = ["wasm-bindgen"], optional = true }
